<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>MANICK Quiz</title> <style> * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; } body { min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; background: linear-gradient(135deg, #ff7a18, #af002d 70%); } .container { width: 100%; max-width: 700px; background: white; border-radius: 25px; padding: 35px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25); } /* HEADER */ .header { text-align: center; margin-bottom: 25px; } .logo { font-size: 42px; font-weight: 900; color: #ff4d00; letter-spacing: 3px; } .tagline { color: #666; margin-top: 5px; font-size: 15px; } /* PROGRESS */ .progress-info { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; font-weight: bold; color: #555; } .progress-box { width: 100%; height: 10px; background: #eeeeee; border-radius: 20px; overflow: hidden; margin-bottom: 30px; } .progress-bar { height: 100%; width: 10%; background: linear-gradient(90deg, #ff7a18, #ff2d55); transition: 0.4s ease; } /* QUESTION */ .question-card { background: #fff8f3; border: 2px solid #ffd8c2; border-radius: 18px; padding: 25px; } .question-number { color: #ff5a00; font-size: 15px; font-weight: bold; margin-bottom: 10px; } .question { font-size: 26px; font-weight: 700; line-height: 1.4; color: #222; margin-bottom: 25px; } /* OPTIONS */ .options { display: grid; gap: 14px; } .option-btn { width: 100%; border: 2px solid #dddddd; background: white; color: #222; padding: 16px; border-radius: 14px; font-size: 17px; text-align: left; cursor: pointer; transition: 0.25s ease; } .option-btn:hover { border-color: #ff6a00; background: #fff4eb; transform: translateX(4px); } .correct { background: #dff8e6 !important; border-color: #22a447 !important; color: #116b2b !important; } .wrong { background: #ffe1e1 !important; border-color: #e53935 !important; color: #a31515 !important; } .disabled { pointer-events: none; } /* FEEDBACK */ .feedback { margin-top: 18px; min-height: 28px; text-align: center; font-size: 17px; font-weight: bold; } /* NEXT BUTTON */ .next-btn { width: 100%; margin-top: 20px; padding: 16px; border: none; border-radius: 14px; background: linear-gradient(90deg, #ff7a18, #ff2d55); color: white; font-size: 17px; font-weight: bold; cursor: pointer; display: none; transition: 0.25s ease; } .next-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(255, 80, 0, 0.25); } /* RESULT */ .result { display: none; text-align: center; padding: 20px 10px; } .result-emoji { font-size: 65px; margin-bottom: 10px; } .result h1 { font-size: 40px; color: #ff4d00; margin-bottom: 15px; } .result p { color: #666; font-size: 18px; line-height: 1.6; } .score-circle { width: 150px; height: 150px; margin: 25px auto; border-radius: 50%; background: linear-gradient(135deg, #ff7a18, #ff2d55); display: flex; justify-content: center; align-items: center; color: white; font-size: 42px; font-weight: 900; box-shadow: 0 12px 30px rgba(255, 77, 0, 0.25); } .restart-btn { margin-top: 25px; padding: 14px 28px; border: none; border-radius: 30px; background: #222; color: white; font-size: 16px; font-weight: bold; cursor: pointer; } .restart-btn:hover { background: #000; } /* THANK YOU */ .thank-you { display: none; text-align: center; padding: 30px 10px 10px; } .thank-you .big { font-size: 70px; margin-bottom: 15px; } .thank-you h1 { font-size: 48px; color: #ff4d00; margin-bottom: 15px; } .thank-you p { color: #666; font-size: 18px; line-height: 1.7; } .name { color: #ff4d00; font-weight: bold; } /* MOBILE */ @media (max-width: 600px) { .container { padding: 22px; } .logo { font-size: 32px; } .question { font-size: 21px; } .result h1 { font-size: 32px; } .thank-you h1 { font-size: 38px; } } </style> </head> <body> <div class="container"> <!-- QUIZ --> <div id="quiz"> <div class="header"> <div class="logo">MANICK</div> <div class="tagline"> How well do you know Manick? 😎 </div> </div> <div class="progress-info"> <span id="progressText">Question 1 of 10</span> <span id="percentText">10%</span> </div> <div class="progress-box"> <div class="progress-bar" id="progressBar"></div> </div> <div class="question-card"> <div class="question-number" id="questionNumber"> QUESTION 01 </div> <div class="question" id="question"> Question </div> <div class="options" id="options"></div> <div class="feedback" id="feedback"></div> <button class="next-btn" id="nextBtn" onclick="nextQuestion()"> NEXT → </button> </div> </div> <!-- RESULT --> <div class="result" id="result"> <div class="result-emoji">🎉</div> <h1>Quiz Completed!</h1> <p> You finished the <span class="name">MANICK</span> quiz. </p> <div class="score-circle" id="score"> 0/10 </div> <p id="resultMessage"> Great job! </p> <button class="restart-btn" onclick="restartQuiz()"> PLAY AGAIN </button> </div> <!-- THANK YOU --> <div class="thank-you" id="thankYou"> <div class="big">❤️</div> <h1>THANK YOU!</h1> <p> Thanks for playing the <span class="name">MANICK</span> quiz! 😎 </p> <p> See you again... 🍔🍟🍕 </p> </div> </div> <script> const questions = [ { question: "Manick with spicy food 🌶️", options: [ "a) Avoids it 😖", "b) Loves it 🔥" ], answer: 0 }, { question: "Manick eating fries 🍟", options: [ "a) One by one 😌", "b) Big bite 😂" ], answer: 1 }, { question: "Manick laughing 😂", options: [ "a) Normal 😄", "b) Loud 🤣" ], answer: 0 }, { question: "Manick's vibe 😎", options: [ "a) Comedy mode 😂", "b) Serious mode 😐" ], answer: 0 }, { question: "Manick remembering things 🧠", options: [ "a) Remembers well 🤓", "b) Forgot everything 😂" ], answer: 1 }, { question: "Manick's favourite movie 🎬", options: [ "a) Sita Ramam ❤️", "b) 96 💙" ], answer: 0 }, { question: "Manick's favourite song 🎵", options: [ "a) Pirai Thedum 🌙", "b) Rasathi Unna 🎶" ], answer: 1 }, { question: "Manick's love situation ❤️", options: [ "a) Has a love 💕", "b) Single guy 😎" ], answer: 0 }, { question: "Manick's eating pace 🍛", options: [ "a) Eats slowly 😌", "b) Eats fast ⚡" ], answer: 0 }, { question: "Manick's favourite bike 🏍️", options: [ "a) NS200 🔥", "b) MT15 😎" ], answer: 0 } ]; let currentQuestion = 0; let score = 0; let answered = false; const questionNumber = document.getElementById("questionNumber"); const question = document.getElementById("question"); const options = document.getElementById("options"); const feedback = document.getElementById("feedback"); const nextBtn = document.getElementById("nextBtn"); const progressBar = document.getElementById("progressBar"); const progressText = document.getElementById("progressText"); const percentText = document.getElementById("percentText"); function loadQuestion() { answered = false; feedback.innerHTML = ""; nextBtn.style.display = "none"; const current = questions[currentQuestion]; questionNumber.innerText = "QUESTION " + String(currentQuestion + 1).padStart(2, "0"); question.innerText = current.question; options.innerHTML = ""; current.options.forEach((option, index) => { const button = document.createElement("button"); button.classList.add("option-btn"); button.innerText = option; button.onclick = function () { selectAnswer(index, button); }; options.appendChild(button); }); const progress = ((currentQuestion + 1) / questions.length) * 100; progressBar.style.width = progress + "%"; progressText.innerText = "Question " + (currentQuestion + 1) + " of " + questions.length; percentText.innerText = Math.round(progress) + "%"; } function selectAnswer(selected, button) { if (answered) { return; } answered = true; const correctAnswer = questions[currentQuestion].answer; const allButtons = document.querySelectorAll(".option-btn"); if (selected === correctAnswer) { score++; button.classList.add("correct"); feedback.innerHTML = "✅ Correct! You know Manick well! 😎"; feedback.style.color = "#22a447"; } else { button.classList.add("wrong"); allButtons[correctAnswer].classList.add("correct"); feedback.innerHTML = "❌ Wrong! Better luck next question 😂"; feedback.style.color = "#e53935"; } allButtons.forEach(btn => { btn.classList.add("disabled"); }); nextBtn.style.display = "block"; if (currentQuestion === questions.length - 1) { nextBtn.innerText = "SEE RESULT →"; } else { nextBtn.innerText = "NEXT →"; } } function nextQuestion() { currentQuestion++; if (currentQuestion < questions.length) { loadQuestion(); } else { showResult(); } } function showResult() { document.getElementById("quiz").style.display = "none"; document.getElementById("result").style.display = "block"; document.getElementById("score").innerText = score + "/10"; let message = ""; if (score === 10) { message = "🔥 Perfect! You know Manick better than Manick knows himself!"; } else if (score >= 8) { message = "👏 Excellent! Manick would be impressed!"; } else if (score >= 5) { message = "😎 Not bad! You know Manick pretty well!"; } else if (score >= 3) { message = "😂 Bro, you need to spend more time with Manick!"; } else { message = "🤣 Do you even know Manick?!"; } document.getElementById("resultMessage").innerText = message; } function restartQuiz() { currentQuestion = 0; score = 0; document.getElementById("result").style.display = "none"; document.getElementById("quiz").style.display = "block"; loadQuestion(); } /* SHOW THANK YOU AFTER RESULT MESSAGE */ document.getElementById("result").addEventListener("click", function(event) { if (event.target.classList.contains("restart-btn")) { return; } }); /* Load first question */ loadQuestion(); </script> </body> </html>
